    <script>
    // ============================================
    // Chetar AI - Main Application Logic
    // ============================================
    
    // State
    let chats = JSON.parse(localStorage.getItem('chetar_ai_chats') || '[]');
    let activeChatId = null;
    let isLoading = false;
    let darkMode = localStorage.getItem('chetar_ai_theme') === 'dark';
    let sidebarOpen = true;
    let isListening = false;
    let recognition = null;
    
    // System prompt
    const SYSTEM_PROMPT = `You are Chetar AI, a friendly and helpful AI assistant made by Prayash. You communicate in a warm Hinglish style (mix of Hindi and English). You are knowledgeable, creative, and always helpful.

Rules:
- Be friendly and conversational
- Use Hinglish naturally (Hindi + English mix)
- If user asks for an image, photo, tasveer, or picture - include [IMAGE: detailed English prompt] in your response
- Be concise but thorough
- Help with coding, writing, advice, and general questions
- Always be respectful and positive`;
    
    // Initialize
    function init() {
        if (darkMode) {
            document.documentElement.classList.add('dark');
            updateThemeIcon();
        }
        
        // Mobile: start with sidebar closed
        if (window.innerWidth <= 768) {
            sidebarOpen = false;
            document.getElementById('sidebar').style.width = '0px';
        }
        
        renderChatHistory();
        updateButtons();
    }
    
    // Generate unique ID
    function generateId() {
        return Math.random().toString(36).substring(2) + Date.now().toString(36);
    }
    
    // Save chats to localStorage
    function saveChats() {
        localStorage.setItem('chetar_ai_chats', JSON.stringify(chats));
    }
    
    // Toggle dark mode
    function toggleDarkMode() {
        darkMode = !darkMode;
        document.documentElement.classList.toggle('dark', darkMode);
        localStorage.setItem('chetar_ai_theme', darkMode ? 'dark' : 'light');
        updateThemeIcon();
    }
    
    function updateThemeIcon() {
        const icon = document.getElementById('themeIcon');
        if (darkMode) {
            icon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
        } else {
            icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
        }
    }
    
    // Toggle sidebar
    function toggleSidebar() {
        sidebarOpen = !sidebarOpen;
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        
        if (window.innerWidth <= 768) {
            // Mobile: overlay mode
            sidebar.style.width = sidebarOpen ? '256px' : '0px';
            overlay.classList.toggle('active', sidebarOpen);
        } else {
            // Desktop: collapse mode
            sidebar.style.width = sidebarOpen ? '256px' : '0px';
        }
    }
    
    // Handle window resize
    window.addEventListener('resize', () => {
        if (window.innerWidth > 768) {
            document.getElementById('sidebarOverlay').classList.remove('active');
        }
    });
    
    // New chat
    function newChat() {
        activeChatId = null;
        document.getElementById('welcomeScreen').classList.remove('hidden');
        document.getElementById('messagesContainer').classList.add('hidden');
        document.getElementById('messagesContainer').innerHTML = '';
        document.getElementById('messageInput').value = '';
        document.getElementById('messageInput').focus();
        updateButtons();
        renderChatHistory();
    }
    
    // Render chat history in sidebar
    function renderChatHistory() {
        const container = document.getElementById('chatHistory');
        container.innerHTML = chats.map(chat => `
            <div class="group flex items-center gap-2 px-3 py-2.5 rounded-lg cursor-pointer transition-colors text-sm ${chat.id === activeChatId ? 'bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300' : 'hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-600 dark:text-gray-400'}" onclick="loadChat('${chat.id}')">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0 opacity-50"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                <span class="truncate flex-1">${escapeHtml(chat.title)}</span>
                <button onclick="event.stopPropagation(); deleteChat('${chat.id}')" class="opacity-0 group-hover:opacity-100 p-1 hover:text-red-500 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                </button>
            </div>
        `).join('');
    }
    
    // Load a chat
    function loadChat(chatId) {
        activeChatId = chatId;
        const chat = chats.find(c => c.id === chatId);
        if (!chat) return;
        
        document.getElementById('welcomeScreen').classList.add('hidden');
        document.getElementById('messagesContainer').classList.remove('hidden');
        
        const container = document.getElementById('messagesContainer');
        container.innerHTML = chat.messages.map(msg => createMessageHTML(msg)).join('');
        
        renderChatHistory();
        updateButtons();
        scrollToBottom();
    }
    
    // Delete a chat
    function deleteChat(chatId) {
        chats = chats.filter(c => c.id !== chatId);
        saveChats();
        if (activeChatId === chatId) {
            newChat();
        }
        renderChatHistory();
        updateButtons();
    }
    
    // Clear all chats
    function clearAllChats() {
        if (confirm('Sabhi chats delete karni hain?')) {
            chats = [];
            saveChats();
            newChat();
        }
    }
    
    // Export chat
    function exportChat() {
        const chat = chats.find(c => c.id === activeChatId);
        if (!chat) return;
        const text = chat.messages.map(m => `[${m.role === 'user' ? 'You' : 'Chetar AI'}]: ${m.content}`).join('\n\n');
        const blob = new Blob([text], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `chetar-chat-${chat.title.slice(0, 20)}.txt`;
        a.click();
        URL.revokeObjectURL(url);
    }
    
    // Update buttons visibility
    function updateButtons() {
        document.getElementById('exportBtn').classList.toggle('hidden', !activeChatId);
        document.getElementById('clearBtn').classList.toggle('hidden', chats.length === 0);
    }
    
    // Create message HTML
    function createMessageHTML(msg) {
        const isUser = msg.role === 'user';
        let contentHTML = '';
        
        if (isUser) {
            contentHTML = `<p class="whitespace-pre-wrap">${escapeHtml(msg.content)}</p>`;
        } else {
            contentHTML = `<div class="markdown-body">${marked.parse(msg.content)}</div>`;
        }
        
        let imagesHTML = '';
        if (msg.images && msg.images.length > 0) {
            imagesHTML = `<div class="mt-2 space-y-2">${msg.images.map((img, i) => `
                <div class="relative group rounded-xl overflow-hidden shadow-lg">
                    <img src="${img}" alt="Generated image" class="w-full max-w-md rounded-xl" loading="lazy">
                    <a href="${img}" download="chetar-ai-image.png" target="_blank" rel="noopener" class="absolute top-2 right-2 bg-white/90 dark:bg-gray-800/90 p-2 rounded-full shadow-md opacity-0 group-hover:opacity-100 transition-opacity">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    </a>
                </div>
            `).join('')}</div>`;
        }
        
        return `
            <div class="flex gap-3 ${isUser ? 'flex-row-reverse' : 'flex-row'} mb-4 animate-fade-in">
                ${!isUser ? `<div class="flex-shrink-0 w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white font-bold text-sm shadow-md">C</div>` : ''}
                <div class="max-w-[80%] md:max-w-[70%] ${isUser ? 'ml-auto' : ''}">
                    <div class="rounded-2xl px-4 py-3 ${isUser ? 'bg-blue-50 dark:bg-blue-900/30 text-gray-800 dark:text-gray-100' : 'bg-transparent text-gray-700 dark:text-gray-200'}">
                        ${contentHTML}
                    </div>
                    ${imagesHTML}
                </div>
            </div>
        `;
    }
    
    // Handle suggestion click
    function handleSuggestion(prompt) {
        document.getElementById('messageInput').value = prompt;
        handleSubmit(new Event('submit'));
    }
    
    // Handle form submit
    function handleSubmit(e) {
        e.preventDefault();
        const input = document.getElementById('messageInput');
        const message = input.value.trim();
        if (!message || isLoading) return;
        
        input.value = '';
        input.style.height = 'auto';
        sendMessage(message);
    }
    
    // Handle key down
    function handleKeyDown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSubmit(e);
        }
    }
    
    // Auto resize textarea
    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 128) + 'px';
    }
    
    // Send message to API
    async function sendMessage(userMessage) {
        isLoading = true;
        document.getElementById('sendBtn').disabled = true;
        
        // Create or get active chat
        let chat;
        if (!activeChatId) {
            chat = {
                id: generateId(),
                title: userMessage.slice(0, 40) + (userMessage.length > 40 ? '...' : ''),
                messages: [],
                createdAt: Date.now(),
                updatedAt: Date.now(),
            };
            chats.unshift(chat);
            activeChatId = chat.id;
            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('messagesContainer').classList.remove('hidden');
        } else {
            chat = chats.find(c => c.id === activeChatId);
        }
        
        // Add user message
        const userMsg = { id: generateId(), role: 'user', content: userMessage, timestamp: Date.now() };
        chat.messages.push(userMsg);
        chat.updatedAt = Date.now();
        
        // Render user message
        const container = document.getElementById('messagesContainer');
        container.innerHTML += createMessageHTML(userMsg);
        scrollToBottom();
        
        // Show loading indicator
        const loadingId = 'loading-' + generateId();
        container.innerHTML += `
            <div id="${loadingId}" class="flex gap-3 mb-4 animate-fade-in">
                <div class="flex-shrink-0 w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white font-bold text-sm shadow-md">C</div>
                <div class="flex gap-1 items-center py-3">
                    <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay:0ms"></div>
                    <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay:150ms"></div>
                    <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay:300ms"></div>
                </div>
            </div>
        `;
        scrollToBottom();
        
        // Prepare API messages
        const apiMessages = [
            { role: 'system', content: SYSTEM_PROMPT },
            ...chat.messages.map(m => ({ role: m.role, content: m.content }))
        ];
        
        try {
            // Call Pollinations text API
            const response = await fetch('https://text.pollinations.ai/openai', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ model: 'openai', messages: apiMessages })
            });
            
            if (!response.ok) throw new Error('API Error');
            
            const data = await response.json();
            let aiContent = data.choices?.[0]?.message?.content || 'Sorry, kuch galat ho gaya.';
            
            // Extract image prompts
            const imageRegex = /\[IMAGE:\s*(.*?)\]/gi;
            let imagePrompts = [];
            let match;
            while ((match = imageRegex.exec(aiContent)) !== null) {
                imagePrompts.push(match[1].trim());
            }
            let cleanText = aiContent.replace(imageRegex, '').trim();
            
            // If no explicit [IMAGE] tag but implies image
            if (imagePrompts.length === 0) {
                const keywords = ['image', 'photo', 'tasveer', 'picture', 'banao', 'generate', 'draw', 'paint'];
                if (keywords.some(k => userMessage.toLowerCase().includes(k))) {
                    imagePrompts = [userMessage];
                }
            }
            
            // Generate images
            let images = [];
            for (const prompt of imagePrompts.slice(0, 2)) {
                const encoded = encodeURIComponent(prompt);
                images.push(`https://image.pollinations.ai/prompt/${encoded}?width=1024&height=1024&nologo=true&enhance=true&model=flux`);
            }
            
            // Remove loading indicator
            document.getElementById(loadingId)?.remove();
            
            // Create AI message
            const aiMsg = {
                id: generateId(),
                role: 'assistant',
                content: cleanText || aiContent,
                images: images.length > 0 ? images : undefined,
                timestamp: Date.now()
            };
            chat.messages.push(aiMsg);
            chat.updatedAt = Date.now();
            
            // Typewriter effect
            await typewriterEffect(cleanText || aiContent, container, aiMsg, chat.id);
            
        } catch (error) {
            console.error('API Error:', error);
            document.getElementById(loadingId)?.remove();
            
            const errorMsg = {
                id: generateId(),
                role: 'assistant',
                content: '🙏 Chetar thoda busy hai, fir se try karo! Error: Network issue ya API down ho sakta hai.',
                timestamp: Date.now()
            };
            chat.messages.push(errorMsg);
            container.innerHTML += createMessageHTML(errorMsg);
        }
        
        saveChats();
        renderChatHistory();
        updateButtons();
        isLoading = false;
        document.getElementById('sendBtn').disabled = false;
        scrollToBottom();
    }
    
    // Typewriter effect
    async function typewriterEffect(text, container, msg, chatId) {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'flex gap-3 mb-4 animate-fade-in';
        msgDiv.innerHTML = `
            <div class="flex-shrink-0 w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white font-bold text-sm shadow-md">C</div>
            <div class="max-w-[80%] md:max-w-[70%]">
                <div class="rounded-2xl px-4 py-3 bg-transparent text-gray-700 dark:text-gray-200">
                    <div class="markdown-body typing-cursor" id="typewriter-content"></div>
                </div>
            </div>
        `;
        container.appendChild(msgDiv);
        
        const contentEl = document.getElementById('typewriter-content');
        let displayed = '';
        const chunkSize = 3;
        
        for (let i = 0; i < text.length; i += chunkSize) {
            displayed = text.slice(0, i + chunkSize);
            contentEl.innerHTML = marked.parse(displayed);
            scrollToBottom();
            await sleep(15);
        }
        
        // Final render with full content
        contentEl.innerHTML = marked.parse(text);
        contentEl.classList.remove('typing-cursor');
        contentEl.removeAttribute('id');
        
        // Add images if any
        if (msg.images && msg.images.length > 0) {
            const imagesDiv = document.createElement('div');
            imagesDiv.className = 'mt-2 space-y-2';
            msg.images.forEach((img, idx) => {
                imagesDiv.innerHTML += `
                    <div class="relative group rounded-xl overflow-hidden shadow-lg">
                        <img src="${img}" alt="Generated image" class="w-full max-w-md rounded-xl" loading="lazy">
                        <a href="${img}" download="chetar-ai-image.png" target="_blank" rel="noopener" class="absolute top-2 right-2 bg-white/90 dark:bg-gray-800/90 p-2 rounded-full shadow-md opacity-0 group-hover:opacity-100 transition-opacity">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        </a>
                    </div>
                `;
            });
            msgDiv.querySelector('.max-w-\\[80\\%\\]').appendChild(imagesDiv);
        }
        
        scrollToBottom();
    }
    
    // Speech recognition
    function toggleListening() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            alert('Speech recognition not supported. Chrome use karo.');
            return;
        }
        
        const micBtn = document.getElementById('micBtn');
        
        if (isListening) {
            recognition?.stop();
            isListening = false;
            micBtn.classList.remove('bg-red-100', 'dark:bg-red-900/30', 'text-red-500');
            micBtn.classList.add('hover:bg-gray-200', 'dark:hover:bg-gray-700', 'text-gray-500');
            return;
        }
        
        const SpeechRecognition = window.webkitSpeechRecognition || window.SpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = true;
        recognition.lang = 'hi-IN';
        
        recognition.onresult = (event) => {
            const transcript = Array.from(event.results).map(r => r[0].transcript).join('');
            document.getElementById('messageInput').value = transcript;
        };
        
        recognition.onend = () => {
            isListening = false;
            micBtn.classList.remove('bg-red-100', 'dark:bg-red-900/30', 'text-red-500');
            micBtn.classList.add('hover:bg-gray-200', 'dark:hover:bg-gray-700', 'text-gray-500');
        };
        
        recognition.onerror = () => {
            isListening = false;
            micBtn.classList.remove('bg-red-100', 'dark:bg-red-900/30', 'text-red-500');
            micBtn.classList.add('hover:bg-gray-200', 'dark:hover:bg-gray-700', 'text-gray-500');
        };
        
        recognition.start();
        isListening = true;
        micBtn.classList.add('bg-red-100', 'dark:bg-red-900/30', 'text-red-500');
        micBtn.classList.remove('hover:bg-gray-200', 'dark:hover:bg-gray-700', 'text-gray-500');
    }
    
    // Utility functions
    function scrollToBottom() {
        const chatArea = document.getElementById('chatArea');
        chatArea.scrollTop = chatArea.scrollHeight;
    }
    
    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }
    
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    // Configure marked.js
    marked.setOptions({
        breaks: true,
        gfm: true,
        headerIds: false,
        mangle: false,
    });
    
    // Initialize app
    init();
    </script>
</body>
</html>
