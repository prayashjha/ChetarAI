<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chetar AI - Free AI Chat & Image Generator | Soch Se Zyada</title>
    <meta name="description" content="Chetar AI - Free AI chat and image generation app. No API key needed. Powered by Pollinations AI. Soch Se Zyada!" />
    <meta name="keywords" content="Chetar AI, free AI chat, AI image generator, Pollinations AI, free chatbot, AI assistant" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Chetar AI - Free AI Chat & Image Generator" />
    <meta property="og:description" content="Soch Se Zyada! Free AI chat and image generation. No API key needed. 100% free forever." />
    <meta property="og:image" content="/favicon.svg" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Chetar AI - Free AI Chat & Image Generator" />
    <meta name="twitter:description" content="Soch Se Zyada! Free AI chat and image generation. No API key needed." />
    
    <!-- Theme -->
    <meta name="theme-color" content="#4285f4" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://text.pollinations.ai" />
    <link rel="preconnect" href="https://image.pollinations.ai" />
    
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      /* Loading state */
      .app-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #ffffff;
      }
      .app-loading .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #e8eaed;
        border-top-color: #4285f4;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading">
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
